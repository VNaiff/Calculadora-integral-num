name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        python build_exe.py

    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "version=dev-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        fi

    - name: Create ZIP archive
      shell: bash
      run: |
        cd dist
        7z a -tzip Calculadora-Integral-Windows.zip Calculadora-Integral.exe README.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: calculadora-windows-exe
        path: |
          dist/Calculadora-Integral.exe
          dist/README.txt
          dist/Calculadora-Integral-Windows.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/Calculadora-Integral.exe
          dist/Calculadora-Integral-Windows.zip
          dist/README.txt
        body: |
          # Calculadora com Integração Numérica ${{ steps.get_version.outputs.version }}

          ## 📥 Download

          Baixe o arquivo **Calculadora-Integral.exe** ou o arquivo ZIP completo.

          ## 🚀 Como Usar

          1. Baixe `Calculadora-Integral.exe`
          2. Execute o arquivo (duplo clique)
          3. Se o Windows Smart Screen aparecer, clique em "Mais informações" → "Executar assim mesmo"

          ## ✨ Funcionalidades

          - ✅ Calculadora básica completa
          - ✅ Funções matemáticas avançadas (sin, cos, tan, log, exp, etc.)
          - ✅ Integração numérica com 5 métodos diferentes
          - ✅ Visualização gráfica interativa
          - ✅ Interface moderna e intuitiva

          ## 📊 Métodos de Integração

          - Regra do Trapézio
          - Regra de Simpson 1/3
          - Regra de Simpson 3/8
          - Método de Romberg (com estimativa de erro)
          - Método de Monte Carlo (com estimativa de erro)

          ## 💻 Requisitos

          - Windows 10 ou superior
          - Nenhuma instalação adicional necessária
          - Não requer Python instalado

          ## 📝 Notas

          - Arquivo único portátil (~50-100 MB)
          - Primeira execução pode demorar alguns segundos
          - Antivírus pode dar falso positivo (é seguro!)

          ## 🌐 Versão Web

          Também disponível como aplicação web! Veja o [README.md](https://github.com/VNaiff/Calculadora-integral-num) para instruções.

          ## 🐛 Problemas?

          Abra uma issue em: https://github.com/VNaiff/Calculadora-integral-num/issues
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-info:
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
    - name: Manual build info
      run: |
        echo "::notice::Build manual executado. Para criar um release, crie uma tag de versão (ex: v1.0.0)"
